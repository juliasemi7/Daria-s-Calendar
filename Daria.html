<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026 — Daria's Calendar</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --pkg1-bg: #ebdef0;
            --pkg1-text: #8e44ad;
            --pkg2-bg: #d1f2eb;
            --pkg2-text: #138d75;
            --pkg3-bg: #fdebd0;
            --pkg3-text: #b9770e;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: linear-gradient(135deg, #f5eef8 0%, #f8fafc 100%);
            color: #1e293b;
            min-height: 100vh;
            padding: 16px;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }
        @media (min-width: 640px) { body { padding: 32px; } }
        .wrap { max-width: 1280px; margin: 0 auto; }
        header {
            margin-bottom: 32px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }
        .year-pill {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 16px;
            background: #8e44ad;
            color: #fff;
            font-weight: 800;
            font-size: 14px;
            border-radius: 9999px;
            letter-spacing: 0.05em;
            box-shadow: 0 4px 6px -1px rgba(142, 68, 173, 0.25);
        }
        h1 { font-size: 30px; line-height: 36px; font-weight: 800; color: #0f172a; letter-spacing: -0.025em; }
        @media (min-width: 640px) { h1 { font-size: 36px; line-height: 40px; } }
        .grid { display: grid; grid-template-columns: 1fr; gap: 24px; }
        @media (min-width: 768px) { .grid { grid-template-columns: repeat(2, 1fr); } }
        @media (min-width: 1024px) { .grid { grid-template-columns: repeat(3, 1fr); } }
        @media (min-width: 1280px) { .grid { grid-template-columns: repeat(4, 1fr); } }
        .card {
            background: #fff;
            border-radius: 16px;
            border: 1px solid rgba(226, 232, 240, 0.85);
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: box-shadow 0.3s;
        }
        .card:hover { box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.1); }
        .card-head {
            background: #f1f5f9;
            color: #1e293b;
            padding: 10px 16px;
            font-weight: 700;
            font-size: 16px;
            letter-spacing: 0.025em;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid rgba(226, 232, 240, 0.6);
        }
        .card-head small { font-size: 12px; color: #94a3b8; font-weight: 400; letter-spacing: normal; }
        .card-body { padding: 12px; flex: 1; display: flex; flex-direction: column; justify-content: center; }
        table { width: 100%; border-collapse: separate; border-spacing: 4px; text-align: center; }
        th { padding: 4px 0; font-size: 11px; font-weight: 700; color: #94a3b8; text-transform: uppercase; }
        th.we { color: #ef4444; }
        td {
            width: 32px; height: 32px;
            font-size: 12px; font-weight: 600;
            border-radius: 8px;
            vertical-align: middle;
            position: relative;
        }
        td.weekend { background: #fef2f2; color: #ef4444; }
        td.other-month { color: #cbd5e1; font-weight: 400; }
        td.pkg1 { background: var(--pkg1-bg); color: var(--pkg1-text); font-weight: 700; }
        td.pkg2 { background: var(--pkg2-bg); color: var(--pkg2-text); font-weight: 700; }
        td.pkg3 { background: var(--pkg3-bg); color: var(--pkg3-text); font-weight: 700; }
        td.lesson { font-weight: 800; }
        td.lesson.pkg1 { box-shadow: inset 0 0 0 2px var(--pkg1-text); }
        td.lesson.pkg2 { box-shadow: inset 0 0 0 2px var(--pkg2-text); }
        td.lesson.pkg3 { box-shadow: inset 0 0 0 2px var(--pkg3-text); }
        td.lesson::after {
            content: '';
            position: absolute;
            top: 3px; right: 3px;
            width: 5px; height: 5px;
            border-radius: 50%;
        }
        td.lesson.pkg1::after { background: var(--pkg1-text); }
        td.lesson.pkg2::after { background: var(--pkg2-text); }
        td.lesson.pkg3::after { background: var(--pkg3-text); }
        footer { margin-top: 48px; text-align: center; font-size: 12px; font-weight: 500; color: #94a3b8; }
    </style>
</head>
<body>
    <div class="wrap">
        <header>
            <div class="year-pill"><span>2026</span></div>
            <h1>Daria's Calendar</h1>
        </header>

        <main>
            <div id="calendarGrid" class="grid"></div>
        </main>

        <footer>
            © 2026 Daria's Calendar
        </footer>
    </div>

    <script>
        const year = 2026;
        const months = ["Январь","Февраль","Март","Апрель","Май","Июнь","Июль","Август","Сентябрь","Октябрь","Ноябрь","Декабрь"];
        const weekDays = ["Пн","Вт","Ср","Чт","Пт","Сб","Вс"];

        const packageDaria = [
            "2026-09-08", "2026-09-09", "2026-09-10", "2026-09-11",
            "2026-09-14", "2026-09-15", "2026-09-16", "2026-09-17", "2026-09-18",
            "2026-09-21", "2026-09-22", "2026-09-23", "2026-09-24", "2026-09-25",
            "2026-09-28", "2026-09-29", "2026-09-30", "2026-10-01", "2026-10-02",
            "2026-10-05"
        ];

        const packageDaria2 = [
            "2026-10-06", "2026-10-07", "2026-10-08", "2026-10-09",
            "2026-10-12", "2026-10-13", "2026-10-14", "2026-10-15", "2026-10-16",
            "2026-10-19", "2026-10-20", "2026-10-21", "2026-10-22", "2026-10-23",
            "2026-10-26", "2026-10-27", "2026-10-28", "2026-10-29", "2026-10-30",
            "2026-11-02"
        ];

        const packageDaria3 = [
            "2026-11-04", "2026-11-05", "2026-11-06",
            "2026-11-09", "2026-11-10", "2026-11-11", "2026-11-12", "2026-11-13",
            "2026-11-16", "2026-11-17", "2026-11-18", "2026-11-19", "2026-11-20",
            "2026-11-23", "2026-11-24", "2026-11-25", "2026-11-26", "2026-11-27",
            "2026-11-30", "2026-12-01"
        ];

        const lessonsDaria = [
            "2026-09-08", "2026-09-09",
            "2026-09-15", "2026-09-16",
            "2026-09-22", "2026-09-23",
            "2026-09-29", "2026-09-30"
        ];
        const lessonsDaria2 = [
            "2026-10-06", "2026-10-07",
            "2026-10-13", "2026-10-14",
            "2026-10-20", "2026-10-21",
            "2026-10-27", "2026-10-28"
        ];
        const lessonsDaria3 = [
            "2026-11-04", "2026-11-10",
            "2026-11-11", "2026-11-17",
            "2026-11-18", "2026-11-24",
            "2026-11-25", "2026-12-01"
        ];

        function getDaysInMonth(y, m) { return new Date(y, m + 1, 0).getDate(); }
        function getStartOffset(y, m) { const d = new Date(y, m, 1).getDay(); return d === 0 ? 6 : d - 1; }
        function formatDate(y, m, d) { return `${y}-${String(m + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`; }

        function getCellClasses(dateStr, y, m, d) {
            const dow = new Date(y, m, d).getDay();
            const isWeekend = (dow === 0 || dow === 6);
            const classes = [];
            if (packageDaria.includes(dateStr)) classes.push("pkg1");
            else if (packageDaria2.includes(dateStr)) classes.push("pkg2");
            else if (packageDaria3.includes(dateStr)) classes.push("pkg3");
            else if (isWeekend) classes.push("weekend");
            if (lessonsDaria.includes(dateStr) || lessonsDaria2.includes(dateStr) || lessonsDaria3.includes(dateStr)) classes.push("lesson");
            return classes.join(" ");
        }

        function renderCalendar() {
            const container = document.getElementById("calendarGrid");
            container.innerHTML = "";

            for (let m = 0; m < 12; m++) {
                const daysInMonth = getDaysInMonth(year, m);
                const startOffset = getStartOffset(year, m);
                const totalCells = Math.ceil((startOffset + daysInMonth) / 7) * 7;

                let cardHtml = `
                <div class="card">
                    <div class="card-head">
                        <span>${months[m]}</span>
                        <small>2026</small>
                    </div>
                    <div class="card-body">
                        <table>
                            <thead>
                                <tr>`;

                for (let w of weekDays) {
                    const isW = (w === "Сб" || w === "Вс");
                    cardHtml += `<th class="${isW ? 'we' : ''}">${w}</th>`;
                }

                cardHtml += `</tr></thead><tbody>`;

                let day = 1;
                for (let i = 0; i < totalCells; i++) {
                    if (i % 7 === 0) cardHtml += "<tr>";

                    if (i < startOffset) {
                        const prevMonth = m === 0 ? 11 : m - 1;
                        const prevYear = m === 0 ? year - 1 : year;
                        const prevDay = getDaysInMonth(prevYear, prevMonth) - (startOffset - i - 1);
                        cardHtml += `<td class="other-month">${prevDay}</td>`;
                    } else if (day <= daysInMonth) {
                        const dateStr = formatDate(year, m, day);
                        cardHtml += `<td class="${getCellClasses(dateStr, year, m, day)}" title="${dateStr}">${day}</td>`;
                        day++;
                    } else {
                        cardHtml += `<td class="other-month">${i - startOffset - daysInMonth + 1}</td>`;
                    }

                    if (i % 7 === 6) cardHtml += "</tr>";
                }

                cardHtml += `</tbody></table></div></div>`;
                container.innerHTML += cardHtml;
            }
        }

        window.onload = renderCalendar;
    </script>
</body>
</html>
